<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17251f">
  <meta name="description" content="Encontre oportunidades de trabalho que combinam com você na Zircon.">
  <title>Zircon — seu próximo passo profissional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--ink:#17251f;--ink-soft:#304239;--paper:#f5f7f3;--white:#fff;--line:#e3e9e2;--muted:#718078;--lime:#d8f36a;--lime-dark:#b8d84d;--green:#287a4d;--red:#b23a2e;--blue:#4563a8;--shadow:0 18px 50px #17251f12;--radius:20px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 "DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button,a{-webkit-tap-highlight-color:transparent}a{color:inherit}.shell{width:min(1160px,100% - 48px);margin:auto}
    .topbar{position:sticky;top:0;z-index:20;padding-top:var(--safe-top);background:#17251ff5;color:#fff;backdrop-filter:blur(18px);box-shadow:0 8px 25px #111b1614}.topbar-inner{min-height:76px;display:flex;align-items:center;gap:30px}.brand{font:800 23px/1 Manrope,sans-serif;letter-spacing:-.08em;color:#fff;text-decoration:none;white-space:nowrap}.brand span{color:var(--lime)}.nav{display:flex;align-items:center;gap:6px;flex:1}.nav a{padding:10px 13px;border-radius:12px;color:#c4cec7;font:700 13px Manrope,sans-serif;text-decoration:none;transition:.2s}.nav a:hover,.nav a.active{background:#ffffff16;color:#fff}.account{display:flex;align-items:center;gap:12px}.user-label{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c4cec7;font-size:12px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 17px;border:1px solid transparent;border-radius:12px;background:var(--ink);color:#fff;font:800 13px Manrope,sans-serif;text-align:center;text-decoration:none;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}.btn:hover{transform:translateY(-1px);box-shadow:0 9px 22px #17251f20;background:var(--ink-soft)}.btn.lime{background:var(--lime);color:var(--ink)}.btn.lime:hover{background:var(--lime-dark)}.btn.light{background:#fff;color:var(--ink);border-color:var(--line)}.btn.light:hover{background:#f5f8f3}.btn.small{min-height:38px;padding:8px 12px;font-size:12px}.btn.full{width:100%}.mobile-menu{display:none}
    main{min-height:calc(100vh - 160px);padding:36px 0 80px}.hero{position:relative;overflow:hidden;isolation:isolate;padding:58px 56px 76px;border-radius:30px;background:var(--ink);color:#fff}.hero:after{content:"";position:absolute;z-index:-1;right:-120px;top:-270px;width:620px;height:620px;border:1px solid #ffffff1a;border-radius:50%;box-shadow:0 0 0 58px #ffffff0a,0 0 0 116px #ffffff07,0 0 0 174px #ffffff04}.eyebrow{margin:0 0 13px;color:var(--lime);font:800 11px Manrope,sans-serif;letter-spacing:.17em;text-transform:uppercase}.hero h1{max-width:730px;margin:0;font:800 clamp(38px,5vw,62px)/1.06 Manrope,sans-serif;letter-spacing:-.065em}.hero-copy{max-width:570px;margin:18px 0 26px;color:#c5d0c8;font-size:16px}.hero-actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.hero-proof{color:#d0d8d2;font-size:12px}.hero-proof strong{color:#fff}.search-card{position:relative;margin:-44px 36px 34px;padding:20px 22px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)}.search-row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(180px,.8fr) auto;align-items:end;gap:12px}.field label{display:block;margin:0 0 7px;color:var(--ink-soft);font:800 11px Manrope,sans-serif}.field input,.field select,.field textarea{width:100%;min-height:47px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#f9fbf8;color:var(--ink);outline:none;transition:border .2s,box-shadow .2s}.field textarea{min-height:120px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#a9c84d;box-shadow:0 0 0 4px #d8f36a55}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 0 16px}.section-head h2{margin:0;font:800 25px Manrope,sans-serif;letter-spacing:-.045em}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.pill{display:inline-flex;align-items:center;padding:5px 10px;border-radius:999px;background:#eff5df;color:#506817;font:800 10px Manrope,sans-serif;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}.job-list{display:grid;gap:12px}.job-card{display:grid;grid-template-columns:54px minmax(0,1fr) auto;align-items:center;gap:16px;padding:19px 20px;border:1px solid var(--line);border-radius:18px;background:#fff;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}.job-card:hover{transform:translateY(-2px);border-color:#cbd6c8;box-shadow:0 12px 28px #17251f0d}.job-logo{display:grid;place-items:center;width:52px;height:52px;border-radius:15px;background:#eef4e8;color:var(--ink);font:800 14px Manrope,sans-serif;text-transform:uppercase}.job-title{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 4px;font:800 16px Manrope,sans-serif;letter-spacing:-.03em}.job-meta{color:var(--muted);font-size:12px}.job-pay{text-align:right;font:800 14px Manrope,sans-serif;white-space:nowrap}.job-pay small{display:block;margin-top:4px;color:var(--muted);font:500 11px "DM Sans",sans-serif}.status{display:inline-flex;padding:4px 9px;border-radius:99px;background:#f1f8d9;color:#536c11;font:800 9px Manrope,sans-serif;letter-spacing:.05em;text-transform:uppercase}.status.PENDENTE{background:#f1f8d9;color:#536c11}.status.EM_ANALISE{background:#e7ecf7;color:var(--blue)}.status.APROVADA{background:#e8f3ec;color:var(--green)}.status.REJEITADA,.status.CANCELADA{background:#fbeae8;color:var(--red)}.status.PAUSADA,.status.FINALIZADA{background:#eee;color:#718078}.notice{margin:0 0 20px;padding:12px 15px;border:1px solid #cce4d2;border-radius:13px;background:#edf8f0;color:#2e6943;font-size:13px}.empty{padding:52px 20px;border:1px dashed #d5ded4;border-radius:18px;background:#fff;text-align:center;color:var(--muted)}.empty strong{display:block;margin-bottom:5px;color:var(--ink);font:800 17px Manrope}
    .content-card{padding:28px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 10px 35px #17251f08}.form-card{width:min(500px,100%);margin:10px auto}.form-card h1,.content-card h1{margin:0 0 8px;font:800 29px Manrope,sans-serif;letter-spacing:-.05em}.form-intro{margin:0 0 22px;color:var(--muted);font-size:13px}.form-stack{display:grid;gap:14px}.form-stack .field label{margin-bottom:7px}.form-stack .field input,.form-stack .field select{background:#fff}.form-footer{margin:17px 0 0;color:var(--muted);font-size:13px}.form-footer a{color:#536c11;font-weight:700}.detail-top{display:flex;justify-content:space-between;align-items:start;gap:14px}.detail-title{margin:0;font:800 clamp(27px,4vw,40px)/1.12 Manrope,sans-serif;letter-spacing:-.055em}.detail-company{margin:8px 0 21px;color:var(--muted)}.detail-description{max-width:780px;white-space:pre-line}.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;padding-top:21px;border-top:1px solid var(--line)}.detail-back{display:inline-flex;margin:0 0 14px;color:#596b5e;font-size:13px;font-weight:700;text-decoration:none}.detail-back:hover{color:var(--green)}.table-wrap{overflow:auto}table{width:100%;min-width:500px;border-collapse:collapse;font-size:13px}th,td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font:800 10px Manrope,sans-serif;letter-spacing:.08em;text-transform:uppercase}.message{margin-bottom:14px;padding:12px 14px;border-radius:12px;font-size:13px}.message.error{border:1px solid #f1c4bd;background:#fff0ed;color:var(--red)}.message.success{border:1px solid #bfe0cb;background:#eaf6ee;color:var(--green)}.loading{padding:65px 16px;text-align:center;color:var(--muted)}.spinner{display:block;width:28px;height:28px;margin:0 auto 12px;border:3px solid var(--line);border-top-color:#91b92b;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    footer{padding:21px 0 calc(22px + var(--safe-bottom));border-top:1px solid var(--line);color:var(--muted);font-size:12px}footer .foot-inner{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}footer code{color:var(--ink-soft);font:600 11px "DM Sans",sans-serif;overflow-wrap:anywhere}
    @media(max-width:760px){.shell{width:min(100% - 32px,620px)}.topbar-inner{min-height:65px;gap:14px;flex-wrap:wrap;padding:10px 0}.brand{font-size:21px}.nav{order:3;width:100%;overflow-x:auto;flex-basis:100%;flex-wrap:nowrap;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav a{flex:none;padding:8px 10px;font-size:12px}.account{margin-left:auto}.user-label{display:none}.mobile-menu{display:none}main{padding:23px 0 50px}.hero{padding:36px 25px 66px;border-radius:23px}.hero h1{font-size:42px}.hero-copy{font-size:14px}.hero:after{right:-300px;top:-155px}.hero-actions{gap:12px}.hero-proof{flex-basis:100%}.search-card{margin:-42px 10px 28px;padding:16px;border-radius:16px}.search-row{grid-template-columns:1fr}.search-row>.btn{width:100%}.section-head{align-items:start;flex-direction:column}.section-head h2{font-size:22px}.job-card{grid-template-columns:44px minmax(0,1fr);gap:12px;padding:14px}.job-logo{width:44px;height:44px;border-radius:13px;font-size:12px}.job-pay{grid-column:2;text-align:left;font-size:13px}.job-title{font-size:14px}.job-meta{font-size:11px}.content-card{padding:20px;border-radius:17px}.form-card h1,.content-card h1{font-size:26px}.detail-top{align-items:start}.detail-title{font-size:29px}.detail-actions>.btn{flex:1}.table-wrap{margin:0 -5px}}
    @media(max-width:390px){.shell{width:calc(100% - 24px)}.hero{padding:29px 20px 60px}.hero h1{font-size:35px}.hero .btn{width:100%}.search-card{margin-left:3px;margin-right:3px}.account .btn{padding:7px 9px;min-height:36px;font-size:11px}.job-card{padding:12px}.pill{font-size:9px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <header class="topbar"><div class="shell topbar-inner">
    <a class="brand" href="#/vagas" aria-label="Zircon, início">zir<span>con</span></a>
    <nav class="nav" id="nav" aria-label="Navegação principal"></nav>
    <div class="account" id="account"></div>
  </div></header>
  <main class="shell"><div id="app" aria-live="polite"><div class="loading"><span class="spinner"></span>Carregando oportunidades…</div></div></main>
  <footer><div class="shell foot-inner"><span>Zircon · oportunidades para trabalhar do seu jeito.</span><span>API: <code id="apiLabel"></code></span></div></footer>
  <script>
    const API_BASE = localStorage.getItem('zircon_api') || 'http://localhost:3000/api';
    const ENDPOINTS = { login:'/auth/login', register:'/auth/register', me:'/auth/me', logout:'/auth/logout', verify:'/auth/verify-email', resendVerification:'/auth/resend-verification', jobs:'/opportunities', applications:'/applications', myApplications:'/applications/my', myJobs:'/opportunities/my' };
    const DEMO_JOBS = [
      {id:'demo-1',job_title:'Product Designer Pleno',company_sector:'Clarity Labs · Tecnologia',work_modality:'HOME_OFFICE',payment_value:8500,status:'ATIVA',job_description:'Buscamos uma pessoa designer para transformar problemas complexos em experiências digitais simples e acessíveis. Você trabalhará próximo aos times de produto e engenharia.',benefits_text:'Trabalho remoto · Horários flexíveis · Auxílio educação'},
      {id:'demo-2',job_title:'Desenvolvedor(a) Front-end',company_sector:'Aurora Digital · Software',work_modality:'HIBRIDO',payment_value:9200,status:'ATIVA',job_description:'Faça parte de um time colaborativo construindo produtos digitais para milhares de pessoas. Experiência com JavaScript, interfaces responsivas e acessibilidade é bem-vinda.',benefits_text:'Plano de saúde · Vale-refeição · Bônus anual'},
      {id:'demo-3',job_title:'Analista de Dados Júnior',company_sector:'Vértice · Serviços financeiros',work_modality:'HOME_OFFICE',payment_value:5800,status:'ATIVA',job_description:'Ajude a transformar dados em decisões. Procuramos alguém curioso, organizado e com vontade de aprender SQL, visualização de dados e métricas de produto.',benefits_text:'Trabalho remoto · Mentoria · Auxílio home office'},
      {id:'demo-4',job_title:'Pessoa Desenvolvedora Backend',company_sector:'Nuvem Aberta · Tecnologia',work_modality:'PRESENCIAL',payment_value:11000,status:'ATIVA',job_description:'Construa APIs e serviços resilientes em uma equipe que valoriza qualidade, autonomia e aprendizado contínuo.',benefits_text:'Plano de saúde · Vale-refeição · Ambiente colaborativo'}
    ];
    const state = { token:localStorage.getItem('zircon_token'), user:null, offline:false, pendingVerification:null };
    const app = () => document.getElementById('app');
    document.getElementById('apiLabel').textContent = API_BASE;
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const money = value => value == null ? 'A combinar' : Number(value).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
    const modalityName = value => ({HOME_OFFICE:'Home office',HIBRIDO:'Híbrido',PRESENCIAL:'Presencial'}[value] || 'Home office');
    const statusTag = value => `<span class="status ${escapeHtml(value || 'ATIVA')}">${escapeHtml((value || 'ATIVA').replace('_',' '))}</span>`;
    function setMessage(target, text, type='error'){ const node=document.getElementById(target); if(node) node.innerHTML=`<div class="message ${type}" role="status">${escapeHtml(text)}</div>`; }
    async function request(path,{method='GET',body,auth=true}={}){
      const headers={'x-platform':'web'};
      if(body) headers['Content-Type']='application/json';
      if(auth && state.token) headers.Authorization=`Bearer ${state.token}`;
      const response=await fetch(API_BASE+path,{method,headers,body:body?JSON.stringify(body):undefined});
      let data={}; try{data=await response.json()}catch{}
      if(!response.ok) {
        const details=data.errors?.map(item=>item.message).filter(Boolean).join('; ');
        throw new Error([data.message || `Erro ${response.status}`, details].filter(Boolean).join(': '));
      }
      return data;
    }
    function route(){const raw=(location.hash||'#/vagas').slice(2);const [path,query='']=raw.split('?');const parts=path.split('/').filter(Boolean);return {page:parts[0]||'vagas',id:parts[1],params:new URLSearchParams(query)}}
    function navigate(hash){location.hash=hash}
    function renderShell(){
      const {page}=route();
      const links=[['vagas','Explorar vagas']];
      if(state.user?.user_type==='PROFISSIONAL') links.push(['candidaturas','Minhas candidaturas']);
      if(state.user?.user_type==='EMPRESA') links.push(['minhas-vagas','Minhas vagas']);
      document.getElementById('nav').innerHTML=links.map(([url,label])=>`<a href="#/${url}" class="${page===url?'active':''}">${label}</a>`).join('');
      const account=document.getElementById('account');
      account.innerHTML=state.user?`<span class="user-label">${escapeHtml(state.user.full_name||state.user.email)}</span><button class="btn small light" id="logout">Sair</button>`:`<a class="btn small light" href="#/login">Entrar</a><a class="btn small lime" href="#/cadastro">Criar conta</a>`;
      document.getElementById('logout')?.addEventListener('click',logout);
    }
    async function logout(){try{await request(ENDPOINTS.logout,{method:'POST'})}catch{}state.token=null;state.user=null;localStorage.removeItem('zircon_token');renderShell();navigate('#/vagas')}
    function jobCard(job){const initials=(job.company_sector||job.job_title||'Z').replace(/[^A-Za-zÀ-ÿ]/g,'').slice(0,2);return `<article class="job-card" tabindex="0" role="link" data-job="${escapeHtml(job.id)}" aria-label="Ver vaga ${escapeHtml(job.job_title)}"><div class="job-logo" aria-hidden="true">${escapeHtml(initials||'Z')}</div><div><h3 class="job-title">${escapeHtml(job.job_title)} ${statusTag(job.status)}</h3><div class="job-meta">${escapeHtml(job.company_sector||'Empresa confidencial')} · ${modalityName(job.work_modality)}</div></div><div class="job-pay">${money(job.payment_value)}<small>por mês · Ver detalhes →</small></div></article>`}
    async function renderJobs(params){
      const search=params.get('q')||'',modality=params.get('mod')||'';let jobs=[],offline=false;
      try{const query=new URLSearchParams({limit:'100'});if(search)query.set('search',search);if(modality)query.set('work_modality',modality);const result=await request(`${ENDPOINTS.jobs}?${query}`,{auth:false});jobs=result.data?.opportunities||[]}
      catch(error){if(error instanceof TypeError||/fetch|network/i.test(error.message)){offline=true;jobs=DEMO_JOBS.filter(job=>(!search||`${job.job_title} ${job.company_sector} ${job.job_description}`.toLowerCase().includes(search.toLowerCase()))&&(!modality||job.work_modality===modality))}else throw error}
      state.offline=offline;
      app().innerHTML=`<section class="hero"><p class="eyebrow">O trabalho do seu jeito</p><h1>Encontre espaço para fazer o seu melhor.</h1><p class="hero-copy">O próximo passo da sua carreira pode estar a um clique. Descubra oportunidades que combinam com você.</p><div class="hero-actions"><a class="btn lime" href="#vagas-lista">Explorar oportunidades <span aria-hidden="true">↓</span></a><span class="hero-proof"><strong>${jobs.length||'Novas'}</strong> oportunidades para descobrir</span></div></section><section class="search-card" id="vagas-lista"><form id="searchForm" class="search-row"><div class="field"><label for="search">O que você procura?</label><input id="search" name="q" value="${escapeHtml(search)}" placeholder="Cargo, habilidade ou empresa" autocomplete="off"></div><div class="field"><label for="modality">Onde quer trabalhar?</label><select id="modality" name="mod"><option value="">Todas as modalidades</option><option value="HOME_OFFICE" ${modality==='HOME_OFFICE'?'selected':''}>Home office</option><option value="HIBRIDO" ${modality==='HIBRIDO'?'selected':''}>Híbrido</option><option value="PRESENCIAL" ${modality==='PRESENCIAL'?'selected':''}>Presencial</option></select></div><button class="btn" type="submit">Buscar vagas <span aria-hidden="true">⌕</span></button></form></section>${offline?'<div class="notice" role="status">Prévia local: a API está desconectada. Estas vagas são exemplos; inicie o backend para ver oportunidades reais.</div>':''}<section><div class="section-head"><div><h2>Oportunidades em destaque</h2><p>${jobs.length} ${jobs.length===1?'vaga encontrada':'vagas encontradas'}${search?` para “${escapeHtml(search)}”`:''}</p></div><span class="pill">Novas oportunidades</span></div><div class="job-list">${jobs.length?jobs.map(jobCard).join(''):'<div class="empty"><strong>Nenhuma vaga encontrada</strong>Tente outra palavra-chave ou altere os filtros.</div>'}</div></section>`;
      document.getElementById('searchForm').addEventListener('submit',event=>{event.preventDefault();const data=new FormData(event.currentTarget);navigate(`#/vagas?q=${encodeURIComponent(data.get('q')||'')}&mod=${encodeURIComponent(data.get('mod')||'')}`)});
      document.querySelectorAll('[data-job]').forEach(card=>{const open=()=>navigate(`#/vaga/${encodeURIComponent(card.dataset.job)}`);card.addEventListener('click',open);card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();open()}})});
    }
    async function renderJob(id){let job;if(id.startsWith('demo-'))job=DEMO_JOBS.find(item=>item.id===id);else{const result=await request(`${ENDPOINTS.jobs}/${encodeURIComponent(id)}`,{auth:false});job=result.data?.opportunity}if(!job)throw new Error('Vaga não encontrada.');const isOwner=state.user&&String(job.user_id)===String(state.user.id);app().innerHTML=`<a class="detail-back" href="#/vagas">← Voltar para oportunidades</a><article class="content-card"><div class="detail-top"><div><p class="eyebrow">Oportunidade profissional</p><h1 class="detail-title">${escapeHtml(job.job_title)}</h1></div>${statusTag(job.status)}</div><p class="detail-company">${escapeHtml(job.company_name||job.company_sector||'Empresa confidencial')} · ${modalityName(job.work_modality)} · ${money(job.payment_value)}</p><div class="detail-description">${escapeHtml(job.job_description||'A empresa ainda não adicionou uma descrição.').replace(/\n/g,'<br>')}</div>${job.benefits_text?`<h2 style="margin:24px 0 6px;font:800 18px Manrope">Benefícios</h2><p>${escapeHtml(job.benefits_text).replace(/\n/g,'<br>')}</p>`:''}<div id="detailMessage"></div>${state.user?.user_type==='PROFISSIONAL'&&!id.startsWith('demo-')?`<div class="field" style="margin-top:18px;"><label for="applyModality">Modalidade de candidatura</label><select id="applyModality" name="work_modality"><option value="HOME_OFFICE" ${job.work_modality==='HOME_OFFICE'?'selected':''}>Home office</option><option value="HIBRIDO" ${job.work_modality==='HIBRIDO'?'selected':''}>Híbrido</option><option value="PRESENCIAL" ${job.work_modality==='PRESENCIAL'?'selected':''}>Presencial</option></select></div>`:''}<div class="detail-actions">${state.user?.user_type==='PROFISSIONAL'&&!id.startsWith('demo-')?'<button class="btn lime" id="apply">Quero me candidatar</button>':''}${!state.user?'<a class="btn lime" href="#/login">Entre para se candidatar</a>':''}${id.startsWith('demo-')?'<span class="job-meta">Conecte a API para enviar sua candidatura.</span>':''}${isOwner?'<a class="btn light" href="#/minhas-vagas">Gerenciar minhas vagas</a>':''}</div></article>`;
      document.getElementById('apply')?.addEventListener('click',async()=>{
        try {
          const selectedModality = document.getElementById('applyModality')?.value || 'HOME_OFFICE';
          await request(ENDPOINTS.applications,{method:'POST',body:{vacancy_id:Number(id), work_modality:selectedModality}});
          setMessage('detailMessage','Candidatura enviada com sucesso!','success');
        } catch (error) {
          setMessage('detailMessage',error.message);
        }
      })
    }
    function renderLogin(){
      app().innerHTML=`<section class="content-card form-card"><p class="eyebrow">Que bom ter você por aqui</p><h1>Entrar na Zircon</h1><p class="form-intro">Acesse sua conta e continue sua jornada profissional.</p><div id="formMessage"></div><form id="loginForm" class="form-stack"><div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="voce@email.com"></div><div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Sua senha"></div><button class="btn lime full" type="submit">Entrar na minha conta</button></form><p class="form-footer">Ainda não tem conta? <a href="#/cadastro">Cadastre-se gratuitamente</a></p></section>`;
      document.getElementById('loginForm').addEventListener('submit',async event=>{event.preventDefault();const body=Object.fromEntries(new FormData(event.currentTarget));try{const result=await request(ENDPOINTS.login,{method:'POST',body,auth:false});state.token=result.data?.accessToken||result.data?.token;state.user=result.data?.user;if(state.token)localStorage.setItem('zircon_token',state.token);renderShell();navigate('#/vagas')}catch(error){setMessage('formMessage',error.message);if(error.message.toLowerCase().includes('não verificado')){const message=document.getElementById('formMessage');message.insertAdjacentHTML('beforeend',`<p class="form-footer"><a href="#/verificar?email=${encodeURIComponent(body.email)}">Verificar meu e-mail</a></p>`)}}});
    }
    function renderRegister(){
      app().innerHTML=`<section class="content-card form-card"><p class="eyebrow">Comece sua próxima etapa</p><h1>Crie sua conta</h1><p class="form-intro">Leva menos de um minuto para fazer parte da comunidade.</p><div id="formMessage"></div><form id="registerForm" class="form-stack"><div class="field"><label for="user_type">Quero me cadastrar como</label><select id="user_type" name="user_type"><option value="PROFISSIONAL">Profissional</option><option value="EMPRESA">Empresa</option></select></div><div class="field"><label for="full_name">Nome completo</label><input id="full_name" name="full_name" required autocomplete="name" minlength="2"></div><div class="field"><label for="reg_email">E-mail</label><input id="reg_email" name="email" type="email" required autocomplete="email"></div><div class="field"><label for="document_type">Documento</label><select id="document_type" name="document_type"><option value="CPF">CPF</option><option value="CNPJ">CNPJ</option><option value="Passaporte">Passaporte</option></select></div><div class="field"><label for="document_number">Número do documento</label><input id="document_number" name="document_number" required autocomplete="off"></div><div class="field"><label for="reg_password">Senha</label><input id="reg_password" name="password" type="password" minlength="8" required autocomplete="new-password"><p class="form-intro" style="margin:6px 0 0">Use ao menos 8 caracteres, uma letra maiúscula e minúscula, um número e um símbolo.</p></div><button class="btn lime full" type="submit">Criar minha conta</button></form><p class="form-footer">Já faz parte da Zircon? <a href="#/login">Entrar</a></p></section>`;
      const role=document.getElementById('user_type');
      const documentType=document.getElementById('document_type');
      const documentNumber=document.getElementById('document_number');
      const updateDocumentLimit=()=>{const limit={CPF:14,CNPJ:18,Passaporte:20}[documentType.value];documentNumber.maxLength=limit;documentNumber.placeholder=documentType.value==='Passaporte'?'6 a 20 caracteres':documentType.value==='CPF'?'000.000.000-00':'00.000.000/0000-00'};
      documentType.addEventListener('change',updateDocumentLimit);
      role.addEventListener('change',()=>{documentType.value=role.value==='EMPRESA'?'CNPJ':'CPF';updateDocumentLimit()});
      updateDocumentLimit();
      document.getElementById('registerForm').addEventListener('submit',async event=>{event.preventDefault();const body=Object.fromEntries(new FormData(event.currentTarget));try{const result=await request(ENDPOINTS.register,{method:'POST',body,auth:false});state.pendingVerification={email:body.email,code:result.data?.verificationCode||''};sessionStorage.setItem('zircon_pending_email',body.email);navigate(`#/verificar?email=${encodeURIComponent(body.email)}`)}catch(error){setMessage('formMessage',error.message)}});
    }
    function renderVerify(params){
      const email=params.get('email')||state.pendingVerification?.email||sessionStorage.getItem('zircon_pending_email')||'';
      const code=state.pendingVerification?.email===email?state.pendingVerification.code:'';
      app().innerHTML=`<section class="content-card form-card"><p class="eyebrow">Só falta confirmar</p><h1>Verifique seu e-mail</h1><p class="form-intro">Digite o código de 6 dígitos enviado para seu e-mail. Em desenvolvimento local, o código aparece preenchido abaixo.</p><div id="formMessage"></div><form id="verifyForm" class="form-stack"><div class="field"><label for="verifyEmail">E-mail</label><input id="verifyEmail" name="email" type="email" value="${escapeHtml(email)}" required autocomplete="email"></div><div class="field"><label for="verificationCode">Código de verificação</label><input id="verificationCode" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" minlength="6" value="${escapeHtml(code)}" required>${code?'<p class="form-intro" style="margin:6px 0 0">Código local de desenvolvimento preenchido automaticamente.</p>':''}</div><button class="btn lime full" type="submit">Confirmar e-mail</button><button class="btn light full" id="resendCode" type="button">Reenviar código</button></form><p class="form-footer"><a href="#/login">Voltar para entrar</a></p></section>`;
      document.getElementById('verifyForm').addEventListener('submit',async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.currentTarget));try{await request(ENDPOINTS.verify,{method:'POST',body:{code:data.code.trim()},auth:false});state.pendingVerification=null;sessionStorage.removeItem('zircon_pending_email');app().innerHTML='<section class="content-card form-card"><p class="eyebrow">Tudo certo</p><h1>E-mail confirmado!</h1><p class="form-intro">Sua conta está ativada. Entre para continuar.</p><a class="btn lime full" href="#/login">Ir para o login</a></section>'}catch(error){setMessage('formMessage',error.message)}});
      document.getElementById('resendCode').addEventListener('click',async()=>{const currentEmail=document.getElementById('verifyEmail').value.trim();try{const result=await request(ENDPOINTS.resendVerification,{method:'POST',body:{email:currentEmail},auth:false});const newCode=result.data?.verificationCode;if(newCode){document.getElementById('verificationCode').value=newCode;state.pendingVerification={email:currentEmail,code:newCode}}sessionStorage.setItem('zircon_pending_email',currentEmail);setMessage('formMessage',newCode?`Novo código local: ${newCode}`:result.message||'Código reenviado. Confira seu e-mail.','success')}catch(error){setMessage('formMessage',error.message)}});
    }
    async function renderApplications(){if(!state.user){navigate('#/login');return}const result=await request(ENDPOINTS.myApplications);const items=result.data?.applications||[];app().innerHTML=`<div class="section-head"><div><p class="eyebrow">Sua jornada</p><h2>Minhas candidaturas</h2><p>Acompanhe as oportunidades que chamaram sua atenção.</p></div></div><section class="content-card">${items.length?`<div class="table-wrap"><table><thead><tr><th>Oportunidade</th><th>Empresa</th><th>Modalidade</th><th>Status</th></tr></thead><tbody>${items.map(item=>`<tr><td>${escapeHtml(item.job_title||`Vaga #${item.vacancy_id}`)}</td><td>${escapeHtml(item.company_name||'—')}</td><td>${escapeHtml(modalityName(item.work_modality||'HOME_OFFICE'))}</td><td>${statusTag(item.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><strong>Seu próximo passo começa com uma busca</strong>Quando se candidatar a uma vaga, ela aparecerá aqui.<p><a class="btn lime" href="#/vagas">Explorar vagas</a></p></div>'}</section>`}
    async function renderMyJobs(){if(!state.user){navigate('#/login');return}const result=await request(ENDPOINTS.myJobs);const jobs=result.data?.opportunities||[];app().innerHTML=`<div class="section-head"><div><p class="eyebrow">Área da empresa</p><h2>Minhas oportunidades</h2><p>Gerencie as vagas publicadas pela sua empresa.</p></div><button class="btn lime" id="newJob">＋ Publicar vaga</button></div><div class="job-list">${jobs.length?jobs.map(jobCard).join(''):'<div class="empty"><strong>Você ainda não publicou vagas</strong>Compartilhe sua primeira oportunidade com a comunidade.</div>'}</div>`;document.getElementById('newJob').addEventListener('click',()=>navigate('#/publicar'));document.querySelectorAll('[data-job]').forEach(card=>card.addEventListener('click',()=>navigate(`#/vaga/${card.dataset.job}`)))}
    function renderPublish(){if(state.user?.user_type!=='EMPRESA'){navigate('#/login');return}app().innerHTML=`<section class="content-card form-card"><p class="eyebrow">Encontre seu próximo talento</p><h1>Publicar oportunidade</h1><p class="form-intro">Conte um pouco sobre a vaga para encontrar a pessoa certa.</p><div id="formMessage"></div><form class="form-stack" id="jobForm"><div class="field"><label for="job_title">Título da vaga</label><input id="job_title" name="job_title" required minlength="2"></div><div class="field"><label for="company_sector">Empresa e setor</label><input id="company_sector" name="company_sector" maxlength="100"></div><div class="field"><label for="job_description">Descrição</label><textarea id="job_description" name="job_description" maxlength="5000"></textarea></div><div class="field"><label for="payment_value">Remuneração mensal (R$)</label><input id="payment_value" name="payment_value" type="number" min="1" step="0.01"></div><div class="field"><label for="work_modality">Modalidade</label><select id="work_modality" name="work_modality"><option value="HOME_OFFICE">Home office</option><option value="HIBRIDO">Híbrido</option><option value="PRESENCIAL">Presencial</option></select></div><button class="btn lime full" type="submit">Publicar vaga</button></form></section>`;document.getElementById('jobForm').addEventListener('submit',async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.currentTarget));if(data.payment_value)data.payment_value=Number(data.payment_value);else delete data.payment_value;try{await request(ENDPOINTS.jobs,{method:'POST',body:data});navigate('#/minhas-vagas')}catch(error){setMessage('formMessage',error.message)}})}
    async function render(){
      renderShell();const {page,id,params}=route();app().innerHTML='<div class="loading"><span class="spinner"></span>Carregando…</div>';try{if(page==='vagas')await renderJobs(params);else if(page==='vaga')await renderJob(id||'');else if(page==='login')renderLogin();else if(page==='cadastro')renderRegister();else if(page==='verificar')renderVerify(params);else if(page==='candidaturas')await renderApplications();else if(page==='minhas-vagas')await renderMyJobs();else if(page==='publicar')renderPublish();else renderJobs(params)}catch(error){app().innerHTML=`<div class="content-card"><div class="message error">${escapeHtml(error.message)}</div><a class="btn light" href="#/vagas">Voltar às vagas</a></div>`}}
    window.addEventListener('hashchange',render);
    (async()=>{if(state.token){try{const result=await request(ENDPOINTS.me);state.user=result.data?.user}catch{state.token=null;localStorage.removeItem('zircon_token')}}await render()})();
  </script>
</body>
</html>
