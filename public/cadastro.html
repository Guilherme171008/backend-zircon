<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zircon | Cadastro</title>
    <style>
      :root {
        --bg: #07111d;
        --panel: rgba(17,24,39,0.9);
        --card: #0f172a;
        --primary: #7c3aed;
        --text: #edf3ff;
        --muted: #a7b6d5;
        --line: rgba(148,163,184,0.2);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #07111d, #0d1c2d 35%, #121b2d);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .auth-shell {
        width: min(560px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 32px 24px;
        box-shadow: 0 24px 60px rgba(0,0,0,0.25);
      }
      .brand { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
      .brand-mark { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(135deg, var(--primary), #38bdf8); font-weight:700; }
      h1 { margin: 0 0 8px; font-size: 2.1rem; }
      p { color: var(--muted); margin: 0 0 20px; }
      form { display:grid; gap:16px; }
      .row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
      label { display:grid; gap:8px; font-weight:600; }
      input, select { width:100%; border:1px solid var(--line); border-radius:12px; background:#0b1220; color:var(--text); padding:14px 12px; font-size:1rem; }
      button, .secondary { display:inline-flex; align-items:center; justify-content:center; min-height:48px; border-radius:12px; font-weight:700; text-decoration:none; }
      button { background:linear-gradient(135deg, var(--primary), #5b21b6); border:none; color:white; width:100%; cursor:pointer; }
      .secondary { background:transparent; border:1px solid var(--line); color: var(--text); width:100%; margin-top:8px; }
      .helper { font-size:0.9rem; color: var(--muted); }
      .helper a { color:#d8b4fe; }
      @media (max-width: 560px) { .row { grid-template-columns:1fr; } }
    </style>
  </head>
  <body>
    <div class="auth-shell">
      <div class="brand">
        <div class="brand-mark">Z</div>
        <strong>Zircon</strong>
      </div>
      <h1>Cadastre-se</h1>
      <p>Crie seu perfil e comece a receber propostas de projetos remotos.</p>

      <form>
        <div class="row">
          <label>
            Nome
            <input type="text" placeholder="Seu nome" />
          </label>
          <label>
            Sobrenome
            <input type="text" placeholder="Seu sobrenome" />
          </label>
        </div>

        <label>
          E-mail
          <input type="email" placeholder="seu@email.com" />
        </label>

        <div class="row">
          <label>
            Senha
            <input type="password" placeholder="••••••••" />
          </label>
          <label>
            Tipo
            <select>
              <option>Freelancer</option>
              <option>Empresa</option>
            </select>
          </label>
        </div>

        <div class="helper">Já tem conta? <a href="/login">Entrar</a></div>
        <button type="submit">Criar conta</button>
        <a class="secondary" href="/">Voltar para a home</a>
      </form>
    </div>
  </body>
</html>
